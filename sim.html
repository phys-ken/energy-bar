<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1210">
<title>エネルギー棒グラフ シミュレーション</title>
<link rel="stylesheet" href="css/sim.css">
</head>
<body>
<div id="app">
  <!-- 操作は 1 行にまとめる（場面・再生・表示）。図の場所を広くとる -->
  <header class="bar">
    <select id="preset" aria-label="場面"></select>
    <button id="bRun" class="primary" type="button">▶ 走らせる</button>
    <button id="bReset" type="button" title="はじめから">↺</button>
    <button id="bSlow" type="button">ゆっくり</button>
    <button id="bForce" class="on" type="button" aria-pressed="true">力の矢印</button>
    <button id="bAdj" class="icon" type="button" title="値を動かす">⚙</button>
    <span class="sp"></span>
    <button id="bTheme" class="icon" type="button" title="明るい画面／黒い画面">☀</button>
    <button id="bFull" class="icon" type="button" title="全画面">⛶</button>
  </header>
  <div id="custom" class="bar sub hidden"></div>

  <!-- 上にコース、下に棒グラフ（横に並べると両方小さくなった）。縦長の場面（鉛直）だけ、横長の画面で左右に並べる -->
  <main id="stage" class="stage">
    <div class="cell course">
      <div id="course"></div>
      <div id="readout" class="readout"></div>
    </div>
    <div class="side">
      <div class="row2"><div id="sys" class="sys"></div><div id="msg" class="msg"></div></div>
      <div id="chart" class="cell chart"></div>
      <p id="fricCap" class="fcap hidden">↑ 摩擦力が台車に負の仕事をした</p>
    </div>
  </main>
</div>

<script src="lib/ebar.js"></script>
<script src="lib/simcore.js"></script>
<script src="js/sim.js"></script>
</body>
</html>
