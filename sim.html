<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e1210">
<title>エネルギー棒グラフ シミュレーション</title>
<link rel="stylesheet" href="css/sim.css">
</head>
<body>
<div id="app">
  <header class="bar">
    <div id="presets" class="presets" role="tablist"></div>
    <div class="tools">
      <button id="bTheme" type="button" title="明るい画面／黒い画面">☀</button>
      <button id="bFull" type="button" title="全画面">⛶</button>
    </div>
  </header>

  <div id="course" class="cell course"></div>

  <div class="info">
    <span id="readout" class="readout"></span>
    <span id="msg" class="msg"></span>
  </div>

  <div id="chart" class="cell chart"></div>
  <p id="fricCap" class="fcap hidden">↑ 摩擦力が台車に負の仕事をした</p>

  <footer class="bar ctl">
    <div class="runbtns">
      <button id="bRun" class="primary" type="button">▶ 走らせる</button>
      <button id="bReset" type="button">↺ はじめから</button>
      <button id="bSlow" type="button">ゆっくり</button>
      <button id="bPredict" type="button">予想する</button>
    </div>
    <div id="predPts" class="predpts hidden"></div>
    <div id="custom" class="custom hidden"></div>
  </footer>
</div>

<script src="lib/ebar.js"></script>
<script src="lib/simcore.js"></script>
<script src="js/sim.js"></script>
</body>
</html>
