<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>エネルギー棒グラフ 演習</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ホーム -->
<section id="vHome" class="view">
  <div class="home">
    <h1>エネルギー棒グラフ 演習</h1>
    <p class="lead">1 回 10 問。時間内に答えましょう。10 問すべて正解で「クリア」です。</p>

    <label class="field"><span>ニックネーム <span class="warnnote">本名は入れないでください</span></span>
      <input id="name" maxlength="16" autocomplete="off" placeholder="ニックネーム">
    </label>

    <h2>1. 単元を選ぶ <span class="dim">（いくつでも。選んだ単元がまざって出ます）</span></h2>
    <div id="units" class="units"></div>

    <h2>2. 出題形式を選ぶ</h2>
    <div id="formats" class="levels"></div>

    <button id="start" class="big primary" type="button">はじめる</button>
    <p id="homeMsg" class="msg"></p>
  </div>
</section>

<!-- 問題 -->
<section id="vQuiz" class="view hidden">
  <header class="qtop">
    <span id="qNum" class="qnum"></span>
    <div class="timer"><div id="timerBar"></div></div>
    <span id="timerTxt" class="ttxt"></span>
    <button id="bSheet" class="tool" type="button">✏️<span class="lbl"> 計算用紙</span></button>
    <button id="bCalc" class="tool" type="button">🧮<span class="lbl"> 電卓</span></button>
  </header>
  <!-- 問題文と問いは 1 か所。その下に図、そのすぐ下で答える（視線を上から下へ 1 本に） -->
  <main class="qscroll" id="qscroll">
    <div class="qcard">
      <p class="qtext"><span id="qText"></span><span id="qAsk" class="ask"></span></p>
      <div class="figs" id="figs"><div id="qScene" class="scene"></div><div id="qChart" class="chart"></div></div>
      <div id="answerArea" class="answer"></div>
      <div id="feedback" class="feedback hidden"></div>
    </div>
  </main>
</section>

<!-- 結果 -->
<section id="vResult" class="view hidden">
  <div class="result">
    <div id="rScore" class="rscore"></div>
    <div id="rClear" class="clear hidden">クリア</div>
    <ol id="rList" class="rlist"></ol>
    <div class="record">
      <img id="recordImg" alt="回答記録の画像">
      <a id="recordDl" class="big primary" href="#" download="回答記録.png">画像を保存</a>
      <p class="dim">保存した画像を Classroom に提出してください。保存できないときは、画像を長押しして保存するか、画面のスクリーンショットを撮ってください。</p>
    </div>
    <div class="row">
      <button id="again" class="big" type="button">もう一度（同じ単元・出題形式）</button>
      <button id="home" class="big" type="button">はじめの画面へ</button>
    </div>
  </div>
</section>

<!-- 計算用紙（下から出る） -->
<div id="sheet" aria-label="計算用紙">
  <div id="grip" title="上下に動かして高さを変える"></div>
  <div id="tools">
    <button id="tPen" class="on" type="button">✒️ ペン</button>
    <button id="tEra" type="button">🧽 消しゴム</button>
    <button id="tUndo" type="button">↶ 戻す</button>
    <button id="tClear" type="button">🗑 全部消す</button>
    <span class="note" id="penNote">指でも書けます（ペンを使うと指は無視）</span>
    <span class="sp"></span>
    <button id="tClose" type="button">✕ 閉じる</button>
  </div>
  <div id="padwrap"><canvas id="pad"></canvas></div>
</div>

<!-- 電卓（浮かぶ・動かせる） -->
<div id="calc">
  <div id="calchead"><span>⠿ 電卓（ここを持って動かす）</span><button id="cClose" type="button">✕</button></div>
  <div id="disp"><div class="ex" id="dEx"></div><div class="rv" id="dRv">0</div></div>
  <div id="ckeys"></div>
</div>

<canvas id="recordCanvas" class="hidden"></canvas>

<script src="vendor/qrcode.js"></script>
<script src="vendor/qrcode_UTF8.js"></script>
<script src="lib/ebar.js"></script>
<script src="lib/scene.js"></script>
<script src="lib/gen.js"></script>
<script src="js/record.js"></script>
<script src="js/tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
